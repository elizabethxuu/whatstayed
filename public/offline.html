<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fefefc" />
<title>Offline · What Stayed</title>
<style>
  :root { --bg: #f8f7f2; --ink: #343733; --soft: #636862; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c1a; --ink: #e9e8e2; --soft: #a6aaa3; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { display: grid; place-items: center; padding: 24px; font-family: 'Cormorant Garamond', Georgia, serif; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; opacity: .9; }
  h1 { margin: 28px 0 0; font-weight: 300; font-size: 34px; }
  p { margin: 12px auto 0; max-width: 22em; font-family: system-ui, sans-serif; font-weight: 300; font-size: 15px; line-height: 1.6; color: var(--soft); }
  button { margin-top: 26px; padding: 11px 26px; border-radius: 999px; border: .75px solid currentColor; background: none; color: var(--ink); font: 400 14px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You’re offline</h1>
    <p>Your garden is kept safely in your account. It will be here as soon as you’re connected again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
